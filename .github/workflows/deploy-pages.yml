name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Keeps data/index.json in sync even if someone adds a lesson file by hand.
      - name: Rebuild lesson index
        run: node tools/build-index.mjs

      - name: Check lesson files are valid
        run: node tools/validate.mjs

      # Bắt cả những lỗi validate không thấy: id lệch tên file, trùng chủ đề,
      # index lệch thư mục lessons, thiếu file web. Cảnh báo không làm đỏ CI.
      - name: Project health check
        run: node tools/doctor.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
